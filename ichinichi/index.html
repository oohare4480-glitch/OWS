<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いちにち時計 と 集中釣り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kami:#F1EFF7;      /* 紙 */
    --shiro:#FFFFFF;
    --sumi:#2A2438;      /* 墨(すみれ寄り) */
    --usu:#7C7391;
    --kasumi:#E2DDEE;
    --hari:#6C5CE7;      /* 針 */
    --yoru:#DAD4EC;      /* 夜の帯 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:0 18px calc(40px + env(safe-area-inset-bottom));
    background:var(--kami);color:var(--sumi);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:440px}

  header{text-align:center;padding:26px 0 6px}
  header h1{
    margin:0;font-family:"Kiwi Maru",serif;font-weight:500;
    font-size:19px;letter-spacing:.14em
  }
  header p{margin:6px 0 0;font-size:11.5px;color:var(--usu);letter-spacing:.06em}

  /* ── 文字盤 ───────────────────────── */
  .dialbox{position:relative;width:100%;aspect-ratio:1;margin-top:6px}
  svg.dial{width:100%;height:100%;display:block;overflow:visible;touch-action:none}
  .ring{cursor:grab}
  .dialbox.turning .ring{cursor:grabbing}
  .turnHint{
    margin:9px 0 0;text-align:center;font-size:11px;color:var(--usu);letter-spacing:.04em
  }
  .turnHint b{color:var(--hari);font-weight:700;font-variant-numeric:tabular-nums}
  .seg{cursor:pointer;transition:opacity .15s}
  .seg:hover{opacity:.82}
  .segLabel{font-family:"Kiwi Maru",serif;fill:#3A3350;pointer-events:none;letter-spacing:.02em}
  .hourTxt{font-size:9.5px;fill:var(--usu);font-weight:500}
  .hourTxt.major{font-size:12px;fill:var(--sumi);font-weight:700}

  .center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;text-align:center
  }
  .center .now{font-size:10.5px;color:var(--usu);letter-spacing:.2em}
  .center .act{
    font-family:"Kiwi Maru",serif;font-size:clamp(19px,6.4vw,25px);
    margin:3px 0 2px;max-width:44%;line-height:1.3
  }
  .center .clk{font-size:12.5px;color:var(--usu);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .center .left{
    margin-top:7px;font-size:10.5px;color:var(--hari);
    background:rgba(108,92,231,.09);padding:4px 10px;border-radius:99px
  }

  /* ── 一覧 ─────────────────────────── */
  section{margin-top:26px}
  h2{margin:0 0 3px;font-family:"Kiwi Maru",serif;font-size:14px;font-weight:500;letter-spacing:.08em}
  .sub{margin:0 0 12px;font-size:11px;color:var(--usu)}

  .item{
    display:flex;align-items:center;gap:11px;background:var(--shiro);
    border-radius:15px;padding:11px 13px;margin-bottom:8px;
    box-shadow:0 1px 3px rgba(42,36,56,.05)
  }
  .item.on{outline:2px solid var(--hari);outline-offset:-2px}
  .dot{width:13px;height:13px;border-radius:4px;flex-shrink:0}
  .item .nm{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .tm{font-size:11.5px;color:var(--usu);font-variant-numeric:tabular-nums;white-space:nowrap}
  .item .dur{font-size:10.5px;color:var(--usu);white-space:nowrap;min-width:44px;text-align:right}
  .x{border:none;background:none;color:var(--usu);font-size:17px;cursor:pointer;padding:2px 4px;line-height:1}

  /* ── 追加 ─────────────────────────── */
  .form{background:var(--shiro);border-radius:17px;padding:14px;box-shadow:0 1px 3px rgba(42,36,56,.05)}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:9px}
  .row:last-child{margin-bottom:0}
  input[type=text],input[type=time]{
    /* iOSは16px未満の入力欄にカーソルが入ると勝手に拡大する。16pxにして止める */
    font-family:inherit;font-size:16px;padding:10px 12px;border-radius:11px;
    border:1px solid var(--kasumi);background:#FBFAFE;color:var(--sumi);
    outline:none;min-width:0;flex:1
  }
  input:focus{border-color:var(--hari)}
  .tilde{color:var(--usu);font-size:12px;flex-shrink:0}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
  .sw[aria-pressed="true"]{border-color:var(--sumi)}
  .add{
    width:100%;font-family:"Kiwi Maru",serif;font-size:14px;padding:13px;
    border-radius:13px;border:none;background:var(--hari);color:#fff;cursor:pointer
  }
  .add:disabled{opacity:.4;cursor:not-allowed}
  .warn{margin:9px 0 0;font-size:11px;color:#C2410C;min-height:14px}

  .tools{display:flex;gap:8px;margin-top:12px}
  .tool{
    flex:1;font-size:12px;padding:11px;border-radius:12px;cursor:pointer;
    background:transparent;border:1px solid var(--kasumi);color:var(--usu);font-family:inherit
  }

  /* ── 集中釣り ───────────────────── */
  #fishSec{margin-top:30px}
  .pond{
    position:relative;border-radius:20px;overflow:hidden;
    background:linear-gradient(180deg,#1E3A5F 0%,#0F2440 100%);
    min-height:154px;display:flex;align-items:center;justify-content:center
  }
  .pond .water{
    position:absolute;inset:0;
    background:
      radial-gradient(60% 40% at 30% 20%, rgba(125,211,252,.16), transparent 70%),
      radial-gradient(50% 35% at 75% 70%, rgba(165,180,252,.14), transparent 70%);
  }
  .pond.casting .water{animation:ripple 5s ease-in-out infinite}
  @keyframes ripple{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .pondIn{position:relative;text-align:center;padding:22px 16px;width:100%}
  .pondState{font-size:11px;color:#9FC6E8;letter-spacing:.16em}
  .pondBig{
    font-family:"Kiwi Maru",serif;color:#fff;margin:6px 0 3px;
    font-size:clamp(22px,7vw,28px);line-height:1.25;word-break:break-word
  }
  .pondSub{font-size:12px;color:#9FC6E8;font-variant-numeric:tabular-nums}
  .pond.hooked .pondBig{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .pond.snapped{background:linear-gradient(180deg,#3A2333 0%,#1F1220 100%)}
  .pond.snapped .pondBig{color:#F4A6B8}

  .wormPick{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 4px;-webkit-overflow-scrolling:touch}
  .worm{
    flex-shrink:0;min-width:78px;padding:9px 10px;border-radius:13px;cursor:pointer;
    background:var(--shiro);border:1px solid var(--kasumi);text-align:center;font-family:inherit
  }
  .worm[aria-pressed="true"]{border-color:var(--hari);background:#F3F1FE}
  .worm .wimg{width:36px;height:36px;display:block;margin:0 auto 3px}
  .worm .wn{font-family:"Kiwi Maru",serif;font-size:12px;display:block}
  .worm .wy{font-size:10.5px;color:var(--usu);display:block;margin-top:2px;font-variant-numeric:tabular-nums}
  .worm .wh{font-size:9.5px;color:var(--hari);display:block;margin-top:1px}
  .worm .wbag{
    display:inline-block;margin-top:3px;font-size:9.5px;padding:1px 6px;border-radius:99px;
    background:#DCF2EF;color:#0F766E
  }

  .fishBtns{margin-top:10px}
  .cast,.pull{
    width:100%;font-family:"Kiwi Maru",serif;font-size:14.5px;padding:14px;
    border-radius:14px;border:none;cursor:pointer
  }
  .cast{background:#1E3A5F;color:#fff}
  .pull{background:transparent;color:var(--hari);border:1.5px solid var(--hari)}
  .sell{
    width:100%;margin-top:8px;font-family:"Kiwi Maru",serif;font-size:13px;padding:12px;
    border-radius:13px;cursor:pointer;background:transparent;
    color:#0F766E;border:1.5px solid #5EAAA3
  }
  .cast:disabled{opacity:.4;cursor:not-allowed}
  .fishNote{margin:9px 0 0;font-size:11px;color:var(--usu);text-align:center;line-height:1.7;min-height:15px}

  .creel{margin-top:16px;background:var(--shiro);border-radius:16px;padding:13px}
  .creelHead{display:flex;justify-content:space-between;font-size:11.5px;color:var(--usu);margin-bottom:9px}
  .creelGrid{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin
  }

  /* 投げる: 振りかぶって前へ振り抜く */
  .rodSwing{transform-origin:20px 172px;animation:swing 1.05s cubic-bezier(.5,-0.3,.3,1.4) both}
  @keyframes swing{
    0%  {transform:rotate(0deg)}
    26% {transform:rotate(-26deg)}
    52% {transform:rotate(16deg)}
    74% {transform:rotate(-5deg)}
    100%{transform:rotate(0deg)}}
  /* ワームが弧を描いて飛び、水面へ落ちる */
  .flyLure{animation:fly 1.05s cubic-bezier(.32,.5,.5,1) both}
  @keyframes fly{
    0%  {transform:translate(70px,150px) scale(.7);opacity:0}
    30% {transform:translate(120px,60px) scale(.9);opacity:1}
    62% {transform:translate(200px,26px) scale(1)}
    88% {transform:translate(226px,104px) scale(.9);opacity:1}
    100%{transform:translate(226px,120px) scale(.6);opacity:0}}
  /* 合わせ: 竿を持ち上げて、しなったまま揺れる */
  .rodPull{transform-origin:20px 172px;animation:pull .9s cubic-bezier(.34,1.4,.5,1) both}
  @keyframes pull{
    0%  {transform:rotate(0deg)}
    38% {transform:rotate(-13deg)}
    70% {transform:rotate(-8deg)}
    100%{transform:rotate(-10deg)}}
  .lineTight{animation:taut .9s ease-out both}
  @keyframes taut{from{opacity:0}to{opacity:1}}
  /* 糸の先で魚が暴れる */
  .hookedFish{animation:thrash .6s ease-in-out .5s infinite alternate}
  @keyframes thrash{
    from{transform:translate(196px,126px) rotate(-16deg)}
    to  {transform:translate(206px,132px) rotate(14deg)}}
  .fishTag{
    font-size:11px;padding:6px 9px;border-radius:11px;background:#F3F1FE;color:#3A3350;
    border:1px solid var(--kasumi);flex-shrink:0;white-space:nowrap
  }
  .fishTag .fn{font-family:"Kiwi Maru",serif}
  .fishTag .mul{font-weight:700;color:var(--hari);margin-left:2px;font-variant-numeric:tabular-nums}
  .fishTag .r{font-size:9px;color:var(--usu);margin-left:3px}
  .fishTag.r5{background:#FFF4E0;border-color:#F0D9A8}
  .fishTag.r6{background:#FFE9F0;border-color:#F5BFD2;font-weight:700}
  .creelEmpty{font-size:11.5px;color:var(--usu)}

  .pond .scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .pondIn{position:relative;z-index:2}
  .rod{stroke:#C9A227;stroke-width:3;stroke-linecap:round;fill:none}
  .line{stroke:rgba(255,255,255,.5);stroke-width:1;fill:none}
  /* 竿を振ってワームを投げ入れる。振りかぶり→前へ振り抜き→戻る。 */
  .pond.casting-anim .rodG{
    transform-origin:12px 172px;   /* 手元を支点に振る */
    animation:swing .95s cubic-bezier(.3,.9,.35,1) both
  }
  @keyframes swing{
    0%  {transform:rotate(0deg)}
    26% {transform:rotate(19deg)}   /* 振りかぶり */
    52% {transform:rotate(-15deg)}  /* 前へ振り抜く */
    72% {transform:rotate(5deg)}
    100%{transform:rotate(0deg)}
  }
  /* 投げ入れたワームが飛んで、水面へ落ちる */
  .flying{animation:fly .95s cubic-bezier(.2,.5,.5,1) both}
  @keyframes fly{
    0%  {transform:translate(-120px,-30px) scale(.6);opacity:0}
    30% {opacity:1}
    100%{transform:translate(0,0) scale(1);opacity:0}
  }
  /* 魚が掛かった瞬間、竿を持ち上げる */
  .pond.hooked .rodG{
    transform-origin:12px 172px;
    animation:liftRod 1.1s cubic-bezier(.25,1.2,.4,1) both
  }
  @keyframes liftRod{
    0%  {transform:rotate(9deg)}    /* 食い込んで先が沈む */
    35% {transform:rotate(-24deg)}  /* 合わせて煽る(拡大) */
    70% {transform:rotate(-14deg)}
    100%{transform:rotate(-16deg)}  /* 持ち上げたまま */
  }
  /* 糸の先の魚が水面から上がり、ゆらゆら揺れる */
  .hang{animation:hangUp 1.1s cubic-bezier(.25,1.15,.4,1) both}
  @keyframes hangUp{
    0%  {transform:translate(226px,124px) scale(.6);opacity:0}
    25% {opacity:1}
    100%{transform:translate(214px,56px) scale(1);opacity:1}
  }
  .hangSwing{
    transform-origin:0 -30px;
    animation:swingFish 2.4s ease-in-out 1.1s infinite
  }
  @keyframes swingFish{
    0%,100%{transform:rotate(-7deg)}
    50%    {transform:rotate(7deg)}
  }

  /* 入水点から波紋がゆっくり広がる。水中のワームは見えない。 */
  .pond.casting .ripple ellipse{
    transform-origin:226px 118px;
    animation:ring 3.3s ease-out infinite
  }
  @keyframes ring{
    0%  {transform:scale(.35);opacity:0}
    18% {opacity:.9}
    100%{transform:scale(1.9);opacity:0}}
  .pond.snapped .line{stroke:#F4A6B8;stroke-dasharray:3 5}
  .bub{fill:rgba(159,198,232,.5)}
  .pond.casting .bub{animation:rise 4s linear infinite}
  .pond.casting .bub:nth-of-type(2){animation-delay:1.3s}
  .pond.casting .bub:nth-of-type(3){animation-delay:2.6s}
  @keyframes rise{0%{transform:translateY(0);opacity:0}
    15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-58px);opacity:0}}
  .catchInner{animation:leap 1.25s cubic-bezier(.28,1.5,.45,1) both}
  @keyframes leap{
    0%  {transform:translate(0,60px) rotate(52deg) scale(.55);opacity:0}
    30% {opacity:1}
    62% {transform:translate(-14px,-16px) rotate(-16deg) scale(1.04)}
    100%{transform:translate(0,0) rotate(-7deg) scale(1);opacity:1}}
  .drip{animation:drip .9s ease-in .25s both}
  @keyframes drip{
    0%{transform:translate(0,0);opacity:.85}
    100%{transform:translate(0,34px);opacity:0}}
  .splash{fill:none;stroke:rgba(255,255,255,.75);stroke-width:2;animation:spread .7s ease-out both}
  @keyframes spread{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.5)}}

  .fishTag{display:inline-flex;align-items:center;gap:5px}
  .fishTag svg{width:26px;height:15px;flex-shrink:0}
  footer{margin-top:30px;text-align:center;font-size:10.5px;color:#A69FB8;line-height:1.9}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>いちにち時計</h1>
    <p>ひとまわりで24時間。針がいまを指します</p>
  </header>

  <div class="dialbox">
    <svg class="dial" id="dial" viewBox="0 0 400 400"></svg>
    <div class="center">
      <div class="now">いま</div>
      <div class="act" id="actNow">—</div>
      <div class="clk" id="clkNow">--:--</div>
      <div class="left" id="leftNow" style="display:none"></div>
    </div>
  </div>

  <p class="turnHint" id="turnHint">円をつまんで回すと、予定ぜんたいをずらせます</p>


  <section id="fishSec">
    <h2>集中釣り</h2>
    <p class="sub">お金をワームに換えて、糸を垂らす。<br>
      画面を離れると糸が切れて、ワームは戻りません。<br>取り出せるのは 垂らしてから10秒だけ。</p>

    <div class="pond" id="pond">
      <div class="water"></div>
      <svg class="scene" id="scene" viewBox="0 0 300 190" aria-hidden="true"></svg>
      <div class="pondIn">
        <div class="pondState" id="pondState">まだ 糸を垂らしていません</div>
        <div class="pondBig" id="pondBig">—</div>
        <div class="pondSub" id="pondSub"></div>
      </div>
    </div>

    <div class="wormPick" id="wormPick"></div>

    <div class="fishBtns">
      <button class="cast" id="castBtn">ワームを買って 糸を垂らす</button>
      <button class="pull" id="pullBtn" style="display:none">糸を上げて お金を取り出す</button>
      <button class="sell" id="sellBtn" style="display:none">ワームを売る（全額もどる）</button>
    </div>
    <p class="fishNote" id="fishNote"></p>

    <div class="creel">
      <div class="creelHead">
        <span>びく（釣った魚）</span>
        <span id="creelCount">0 / 129</span>
      </div>
      <div class="creelGrid" id="creelGrid"></div>
    </div>
  </section>

  <section>
    <h2>よてい</h2>
    <p class="sub" id="totalTxt"></p>
    <div id="list"></div>
  </section>

  <section>
    <h2>あたらしく 足す</h2>
    <p class="sub">日をまたぐ時間(23:00〜6:00 など)も入れられます</p>
    <div class="form">
      <div class="row">
        <input type="text" id="fName" maxlength="8" placeholder="なまえ(例: 勉強)">
      </div>
      <div class="row">
        <input type="time" id="fFrom" value="09:00">
        <span class="tilde">〜</span>
        <input type="time" id="fTo" value="12:00">
      </div>
      <div class="row"><div class="swatches" id="swatches"></div></div>
      <button class="add" id="addBtn">足す</button>
      <p class="warn" id="warn"></p>
    </div>
    <div class="tools">
      <button class="tool" id="resetBtn">見本にもどす</button>
      <button class="tool" id="clearBtn">ぜんぶ消す</button>
    </div>
  </section>

  <footer>
    予定はこの端末に保存されます。<br>
    ほかの人には見えません。
  </footer>
</div>

<script>
(function(){
  "use strict";

  const COLORS = ["#A5B4FC","#F9A8D4","#86EFAC","#FDBA74","#FDE047","#7DD3FC","#C4B5FD","#FCA5A5"];
  const SAMPLE = [
    { name:"朝食", from:300,  to:360,  color:"#FDBA74" },
    { name:"運動", from:360,  to:390,  color:"#FCA5A5" },
    { name:"入浴", from:390,  to:420,  color:"#F9A8D4" },
    { name:"仕事", from:420,  to:660,  color:"#86EFAC" },
    { name:"昼食", from:660,  to:720,  color:"#FDBA74" },
    { name:"仕事", from:720,  to:840,  color:"#86EFAC" },
    { name:"運動", from:840,  to:900,  color:"#FCA5A5" },
    { name:"仕事", from:900,  to:1020, color:"#86EFAC" },
    { name:"夕食", from:1020, to:1080, color:"#FDBA74" },
    { name:"自由", from:1080, to:1140, color:"#C4B5FD" },
    { name:"入浴", from:1140, to:1170, color:"#F9A8D4" },
    { name:"自由", from:1170, to:1260, color:"#C4B5FD" },
    { name:"睡眠", from:1260, to:300,  color:"#A5B4FC" }
  ];

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,"0");
  const toHM = m => pad(Math.floor(m/60)%24)+":"+pad(m%60);
  const fromHM = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };

  /* ── 保存(使えない環境でも落ちないように) ── */
  const store = {
    load(){
      try{ const v = localStorage.getItem("ichinichi"); return v ? JSON.parse(v) : null; }
      catch(e){ return null; }
    },
    save(v){ try{ localStorage.setItem("ichinichi", JSON.stringify(v)); }catch(e){} }
  };

  let items = store.load() || SAMPLE.slice();
  let pickedColor = COLORS[0];
  let selected = -1;
  let turn = 0;          // 回している最中のズレ(分)。離した時に予定へ焼き付ける
  const wrapMin = m => ((m % 1440) + 1440) % 1440;
  const shifted = it => ({ ...it, from: wrapMin(it.from + turn), to: wrapMin(it.to + turn) });

  /* ── 円の計算 ─────────────────────── */
  const CX = 200, CY = 200, R_OUT = 158, R_IN = 92, R_HOUR = 178;
  const toXY = (r, mins) => {
    const a = (mins/1440)*Math.PI*2 - Math.PI/2;   // 0:00 を真上に
    return [CX + r*Math.cos(a), CY + r*Math.sin(a)];
  };
  function arcPath(from, to){
    // 日をまたぐ場合は呼び出し側で分割済み
    const span = to - from;
    const big = span > 720 ? 1 : 0;
    const [x1,y1] = toXY(R_OUT, from), [x2,y2] = toXY(R_OUT, to);
    const [x3,y3] = toXY(R_IN,  to),   [x4,y4] = toXY(R_IN,  from);
    return `M${x1} ${y1} A${R_OUT} ${R_OUT} 0 ${big} 1 ${x2} ${y2}
            L${x3} ${y3} A${R_IN} ${R_IN} 0 ${big} 0 ${x4} ${y4} Z`;
  }
  // 日またぎを 0時で切って、描ける区間の配列にする
  function pieces(it){
    return it.from <= it.to
      ? [[it.from, it.to]]
      : [[it.from, 1440],[0, it.to]];
  }
  const durOf = it => it.from <= it.to ? it.to - it.from : (1440 - it.from) + it.to;
  const contains = (it, m) => it.from <= it.to
    ? (m >= it.from && m < it.to)
    : (m >= it.from || m < it.to);

  /* ── 描画 ─────────────────────────── */
  function drawDial(){
    const nowM = curMin();
    let s = "";

    // 夜の帯(18時〜6時)をうっすら敷く
    s += `<circle class="ring" cx="${CX}" cy="${CY}" r="${(R_OUT+R_IN)/2}" fill="none"
           stroke="var(--yoru)" stroke-width="${R_OUT-R_IN}" opacity=".45"/>`;
    s += `<path class="ring" d="${arcPath(360,1080)}" fill="#FFFFFF" opacity=".75"/>`;

    // 予定(回している最中はズレを乗せて描く)
    items.map(shifted).forEach((it, i) => {
      pieces(it).forEach(([a,b]) => {
        if(b - a < 1) return;
        s += `<path class="seg ring" data-i="${i}" d="${arcPath(a,b)}" fill="${it.color}"
               stroke="var(--kami)" stroke-width="2"
               opacity="${selected===i?1:.92}"/>`;
      });
      // 名前は一番長い区間の真ん中に、円に沿って傾けて置く。
      // 横書きのままだと細い区間(30分など)には収まらないが、
      // 半径の向きに寝かせればドーナツの厚み(66px)を使えるので入る。
      const seg = pieces(it).sort((p,q)=>(q[1]-q[0])-(p[1]-p[0]))[0];
      const span = seg[1] - seg[0];
      if(span >= 18){
        const mid = (seg[0]+seg[1])/2;
        const [tx,ty] = toXY((R_OUT+R_IN)/2, mid);
        const deg = (mid/1440)*360;                    // 0時が真上、時計回り
        const rot = deg > 180 ? deg + 90 : deg - 90;   // 左半分は反転させて逆さ字を防ぐ
        const fs = span < 40 ? 9.5 : span < 70 ? 10.5 : 11.5;
        s += `<text class="segLabel" x="${tx}" y="${ty}" font-size="${fs}"
               transform="rotate(${rot.toFixed(2)} ${tx.toFixed(2)} ${ty.toFixed(2)})"
               text-anchor="middle" dominant-baseline="middle">${esc(it.name)}</text>`;
      }
    });

    // 目盛りと数字
    for(let h=0; h<24; h++){
      const m = h*60, major = h%6===0;
      const [ax,ay] = toXY(R_OUT+3, m), [bx,by] = toXY(R_OUT+(major?11:7), m);
      s += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"
             stroke="${major?'var(--sumi)':'var(--kasumi)'}" stroke-width="${major?2:1.4}" stroke-linecap="round"/>`;
      const [tx,ty] = toXY(R_HOUR, m);
      s += `<text class="hourTxt ${major?'major':''}" x="${tx}" y="${ty}"
             text-anchor="middle" dominant-baseline="middle">${h}</text>`;
    }

    // 針(1日で一周)
    const [hx,hy] = toXY(R_OUT-6, nowM);
    s += `<line x1="${CX}" y1="${CY}" x2="${hx}" y2="${hy}" stroke="var(--hari)"
           stroke-width="2.6" stroke-linecap="round"/>`;
    s += `<circle cx="${hx}" cy="${hy}" r="5" fill="var(--hari)"/>`;
    s += `<circle cx="${CX}" cy="${CY}" r="4.5" fill="var(--hari)"/>`;

    $("dial").innerHTML = s;
    $("dial").querySelectorAll(".seg").forEach(el=>{
      el.onclick = ()=>{ selected = selected===+el.dataset.i ? -1 : +el.dataset.i; render(); };
    });
  }
  const esc = s => String(s).replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

  function curMin(){
    const d = new Date();
    return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
  }

  function drawList(){
    const nowM = curMin();
    const sorted = items.map((it,i)=>({it,i})).sort((a,b)=>a.it.from-b.it.from);
    $("list").innerHTML = sorted.map(({it,i})=>{
      const d = durOf(it), h = Math.floor(d/60), mm = d%60;
      return `<div class="item ${selected===i?'on':''}" data-i="${i}">
        <span class="dot" style="background:${it.color}"></span>
        <span class="nm">${esc(it.name)}</span>
        <span class="tm">${toHM(it.from)}〜${toHM(it.to)}</span>
        <span class="dur">${h?h+"時間":""}${mm?mm+"分":(h?"":"0分")}</span>
        <button class="x" data-del="${i}" aria-label="消す">×</button>
      </div>`;
    }).join("") || `<p class="sub">まだ何も入っていません</p>`;

    $("list").querySelectorAll("[data-del]").forEach(b=>{
      b.onclick = e=>{ e.stopPropagation(); items.splice(+b.dataset.del,1); selected=-1; commit(); };
    });
    $("list").querySelectorAll(".item").forEach(el=>{
      el.onclick = ()=>{ selected = selected===+el.dataset.i ? -1 : +el.dataset.i; render(); };
    });

    const used = items.reduce((s,it)=>s+durOf(it),0);
    const free = Math.max(0, 1440-used);
    $("totalTxt").textContent =
      `うまっている ${Math.floor(used/60)}時間${pad(used%60)}分 ／ あいている ${Math.floor(free/60)}時間${pad(free%60)}分`;
  }

  function drawNow(){
    const nowM = curMin();
    const d = new Date();
    $("clkNow").textContent = pad(d.getHours())+":"+pad(d.getMinutes());
    const cur = items.map(shifted).find(it=>contains(it, nowM));
    $("actNow").textContent = cur ? cur.name : "よてい なし";
    if(cur){
      const end = cur.to;
      let left = (end - nowM + 1440) % 1440;
      const h = Math.floor(left/60), m = Math.floor(left%60);
      $("leftNow").style.display = "";
      $("leftNow").textContent = `あと ${h?h+"時間":""}${m}分`;
    }else{
      $("leftNow").style.display = "none";
    }
  }

  function render(){ drawDial(); drawList(); drawNow(); }
  function commit(){ store.save(items); render(); }

  /* ── 追加 ─────────────────────────── */
  $("swatches").innerHTML = COLORS.map(c=>
    `<button class="sw" style="background:${c}" data-c="${c}" aria-pressed="${c===pickedColor}"></button>`).join("");
  $("swatches").querySelectorAll(".sw").forEach(b=>{
    b.onclick = ()=>{
      pickedColor = b.dataset.c;
      $("swatches").querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed", x.dataset.c===pickedColor));
    };
  });

  $("addBtn").onclick = ()=>{
    const name = $("fName").value.trim().slice(0,8);
    const from = fromHM($("fFrom").value), to = fromHM($("fTo").value);
    $("warn").textContent = "";
    if(!name){ $("warn").textContent = "なまえを入れてください"; return; }
    if(from === to){ $("warn").textContent = "はじまりと おわりが同じです"; return; }

    const nw = { name, from, to, color: pickedColor };
    const clash = items.find(it => overlaps(it, nw));
    if(clash){ $("warn").textContent = `「${clash.name}」と重なっています`; return; }

    items.push(nw);
    $("fName").value = "";
    commit();
  };
  // 分単位で重なりを見る(日またぎも正しく判定する)
  function overlaps(a,b){
    for(let m=0;m<1440;m++) if(contains(a,m) && contains(b,m)) return true;
    return false;
  }

  $("resetBtn").onclick = ()=>{ items = SAMPLE.slice(); selected=-1; commit(); };
  $("clearBtn").onclick = ()=>{ items = []; selected=-1; commit(); };

  /* ── 金庫のダイヤルのように輪を回す ──────────
     目盛りと針は動かさず、予定の輪だけを回す。
     時差ボケや夜勤で生活が丸ごとずれた時に、予定を作り直さずに済む。 */
  const dialEl = $("dial"), boxEl = document.querySelector(".dialbox");
  let drag = null;

  function angleMin(ev){
    const r = dialEl.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width  * 400 - CX;
    const y = (ev.clientY - r.top ) / r.height * 400 - CY;
    const a = Math.atan2(y, x) + Math.PI/2;          // 真上を0にする
    return wrapMin(a / (Math.PI*2) * 1440);
  }
  function inRing(ev){
    const r = dialEl.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width  * 400 - CX;
    const y = (ev.clientY - r.top ) / r.height * 400 - CY;
    const d = Math.hypot(x, y);
    return d >= R_IN - 6 && d <= R_OUT + 6;
  }

  dialEl.addEventListener("pointerdown", ev=>{
    if(!inRing(ev)) return;
    drag = { startMin: angleMin(ev), moved: 0, last: angleMin(ev), id: ev.pointerId };
    dialEl.setPointerCapture(ev.pointerId);
    boxEl.classList.add("turning");
  });

  dialEl.addEventListener("pointermove", ev=>{
    if(!drag) return;
    const now = angleMin(ev);
    // 0時をまたいでも自然に回るよう、前回との差分を積み上げる
    let step = now - drag.last;
    if(step >  720) step -= 1440;
    if(step < -720) step += 1440;
    drag.last = now;
    drag.moved += Math.abs(step);
    turn = wrapMin(turn + step);
    drawDial(); drawNow(); showTurn();
  });

  function endDrag(ev){
    if(!drag) return;
    const wasTap = drag.moved < 4;          // ほとんど動いていなければ「選択」とみなす
    drag = null;
    boxEl.classList.remove("turning");
    if(wasTap){ turn = 0; showTurn(); render(); return; }

    // 5分刻みに揃えて、予定そのものへ焼き付ける
    const snap = Math.round(turn / 5) * 5;
    if(snap % 1440 !== 0){
      items = items.map(it=>({ ...it, from: wrapMin(it.from + snap), to: wrapMin(it.to + snap) }));
    }
    turn = 0;
    showTurn();
    commit();
  }
  dialEl.addEventListener("pointerup", endDrag);
  dialEl.addEventListener("pointercancel", endDrag);

  function showTurn(){
    const h = $("turnHint");
    if(!drag){ h.innerHTML = "円をつまんで回すと、予定ぜんたいをずらせます"; return; }
    const snap = Math.round(turn / 5) * 5;
    const s = snap > 720 ? snap - 1440 : snap;       // 近いほうの向きで表す
    const sign = s >= 0 ? "+" : "−";
    const av = Math.abs(s), hh = Math.floor(av/60), mm = av%60;
    h.innerHTML = `ぜんたいを <b>${sign}${hh?hh+"時間":""}${mm?mm+"分":(hh?"":"0分")}</b> ずらす`;
  }


  /* ══ 集中釣り ═══════════════════════════

     お金は「取り出す」ボタンでいつでも戻せる = 罰金ではなく貯金箱。 */
  const FISH = {"1": ["マハゼ", "ウグイ", "モツゴ", "オイカワ", "ブルーギル", "ボラ", "サッパ", "コノシロ", "スズメダイ", "ネンブツダイ", "クサフグ", "ヒイラギ", "ゴンズイ", "アイゴ", "カワムツ", "タナゴ", "ドジョウ", "ヌマチチブ"], "2": ["アジ", "サバ", "マイワシ", "カサゴ", "メバル", "カワハギ", "シロギス", "マコガレイ", "クロソイ", "ムラソイ", "マアナゴ", "タチウオ", "ホウボウ", "マエソ", "ニジマス", "ヤマメ", "ギンブナ", "コイ", "ナマズ", "テナガエビ", "メジナ", "ウミタナゴ", "サヨリ", "カマス"], "3": ["イサキ", "アイナメ", "クロダイ", "キビレ", "マゴチ", "ヒラメ", "サワラ", "シイラ", "ハタハタ", "アオリイカ", "コウイカ", "ヤリイカ", "マダコ", "タカベ", "ウマヅラハギ", "アマゴ", "イワナ", "オショロコマ", "ワカサギ", "ヒラメ", "メゴチ", "イシモチ", "シログチ", "ハナダイ"], "4": ["マダイ", "ブリ", "ワラサ", "カンパチ", "ヒラマサ", "スズキ", "ヒラスズキ", "マハタ", "キジハタ", "オオモンハタ", "アカハタ", "メダイ", "マトウダイ", "オニカサゴ", "イシダイ", "イシガキダイ", "シマアジ", "サクラマス", "サツキマス", "ライギョ", "ブラックバス", "ヒラメ座布団", "マゴチ大物", "アカムツ", "クロムツ"], "5": ["クエ", "アカアマダイ", "シロアマダイ", "キンメダイ", "キチジ", "アラ", "ハマフエフキ", "ロウニンアジ", "カスミアジ", "バラハタ", "スジアラ", "アメマス", "ヒメマス", "ビワマス", "マツカワ", "ホシガレイ", "オヒョウ", "アコウダイ", "ムツ", "ソウダガツオ", "カツオ", "マゴイ", "レンギョ"], "6": ["クロマグロ", "ミナミマグロ", "キハダマグロ", "メバチマグロ", "ビンナガマグロ", "クロカジキ", "シロカジキ", "バショウカジキ", "メカジキ", "タマカイ", "イトウ", "アカマンボウ", "マンボウ", "ヨシキリザメ", "アオザメ"]};
  const FISH_TOTAL = Object.values(FISH).reduce((s,v)=>s+v.length,0);
  const RARITY_NAME = {1:"ふつう",2:"よくいる",3:"なかなか",4:"みごと",5:"大物",6:"伝説"};

  // 1〜24時間のワーム。値段は1時間=1000円
  const WORMS = [
    "ゴカイ","イソメ","アオイソメ","ジャリメ","オキアミ","エビ","カニ","イカタン",

    "クローワーム","シュリンプ","スイムベイト","メタルジグ","タイラバ","インチク","バイブレーション","ビッグベイト"

  const wormOf = h => h===0
    ? { hours:0, name:"ためし釣り", yen:0, ms:10000 }
    : { hours:h, name:WORMS[h-1], yen:h*1000, ms:h*3600000 };

  const fstore = {
    load(){ try{ const v=localStorage.getItem("tsuri"); return v?JSON.parse(v):null; }catch(e){ return null; } },
    save(v){ try{ localStorage.setItem("tsuri",JSON.stringify(v)); }catch(e){} }

  function pickFish(hours){
    hours = Math.max(0.2, hours);
    // 長く粘るほど良い魚が出やすい。1時間でも伝説が出る芽は残す。
    const w = {

      2: 30,
      3: 14 + hours*0.5,
      4: 6  + hours*0.8,
      5: 1.2+ hours*0.6,

    "クエ":["oval","#6B6050"],"アカアマダイ":["oval","#D9846E"],"シロアマダイ":["oval","#D6C4B0"],
    "キンメダイ":["oval","#D64A4A"],"キチジ":["oval","#D95C3C"],"アラ":["oval","#7E7466"],
    "ハマフエフキ":["oval","#8C8272"],"ロウニンアジ":["torpedo","#9EAAB4"],"カスミアジ":["torpedo","#5C7A9E"],
    "バラハタ":["oval","#D9604A"],"スジアラ":["oval","#C4503C"],"アメマス":["torpedo","#7E8478"],
    "ヒメマス":["torpedo","#B06B6B"],"ビワマス":["torpedo","#8C8478"],"マツカワ":["flat","#8C7A5C"],
    "ホシガレイ":["flat","#6E6452"],"オヒョウ":["flat","#5E5A50"],"アコウダイ":["oval","#C4503C"],
    "ムツ":["oval","#54545E"],"ソウダガツオ":["torpedo","#5A7A94"],"カツオ":["torpedo","#546E8C"],
    "マゴイ":["oval","#6E5C42"],"レンギョ":["torpedo","#94A0AC"],
    "クロマグロ":["torpedo","#3C5470"],"ミナミマグロ":["torpedo","#42566E"],"キハダマグロ":["torpedo","#C9A83E"],
    "メバチマグロ":["torpedo","#4A6480"],"ビンナガマグロ":["torpedo","#5A7088"],"クロカジキ":["marlin","#3C4E6B"],
    "シロカジキ":["marlin","#7E8C9E"],"バショウカジキ":["marlin","#4A6E9E"],"メカジキ":["marlin","#54606E"],
    "タマカイ":["oval","#6B6452"],"イトウ":["torpedo","#7A7060"],"アカマンボウ":["round","#C4504A"],
    "マンボウ":["round","#8C94A0"],"ヨシキリザメ":["shark","#5C7494"],"アオザメ":["shark","#4A6480"]
  };
  // 模様。実物の特徴を数種に分類する。
  const PATTERN = {
    "オイカワ":"bars","カワムツ":"bars","ヤマメ":"parr","アマゴ":"parr","サクラマス":"parr",
    "サツキマス":"parr","ビワマス":"parr","イワナ":"spots","オショロコマ":"spots","アメマス":"spots",
    "ニジマス":"spots","ヒメマス":"spots","イトウ":"spots","マダイ":"spots","ハナダイ":"spots",
    "サバ":"waves","ソウダガツオ":"waves","マイワシ":"dots","コノシロ":"dots",
    "イシダイ":"stripes","イシガキダイ":"mesh","シマアジ":"bars","タカベ":"line",
    "クロダイ":"bars","キビレ":"bars","メジナ":"line","ブルーギル":"bars","ブラックバス":"line",
    "カツオ":"lines","キハダマグロ":"line","クロマグロ":"line","メバチマグロ":"line",
    "アオリイカ":"dots","コウイカ":"waves","タチウオ":"none","サヨリ":"none",
    "ヒラメ":"spots","マコガレイ":"spots","マツカワ":"spots","ホシガレイ":"spots","オヒョウ":"spots",
    "キジハタ":"spots","アカハタ":"spots","オオモンハタ":"spots","マハタ":"bars","クエ":"bars",
    "タマカイ":"spots","スジアラ":"dots","バラハタ":"dots","カサゴ":"spots","オニカサゴ":"spots",
    "メバル":"none","クサフグ":"dots","ホウボウ":"spots","マトウダイ":"eye","カワハギ":"none",
    "バショウカジキ":"line","クロカジキ":"bars","シロカジキ":"line","メカジキ":"none",
    "ワカサギ":"none","キンメダイ":"none","アカムツ":"none","ノドグロ":"none"
  };
  function patternOf(name, col){
    const kind = PATTERN[name];
    if(!kind) return "";
    const dk = shade(col,-40), lt = shade(col,45);
    switch(kind){
      case "bars":   // オイカワやクロダイのような縦じま
        return [22,32,42,52,62].map(x=>
          `<path d="M${x} 13 q2 17 0 34" stroke="${dk}" stroke-width="3.5" opacity=".38" fill="none"/>`).join("");
      case "stripes":
        return [26,40,54,68].map(x=>
          `<path d="M${x} 10 q2 20 0 40" stroke="${dk}" stroke-width="6" opacity=".5" fill="none"/>`).join("");
      case "parr":   // ヤマメのパーマーク
        return [24,36,48,60].map(x=>
          `<ellipse cx="${x}" cy="28" rx="5" ry="8" fill="${dk}" opacity=".34"/>`).join("");
      case "spots":
        return [[26,22],[36,34],[46,20],[54,36],[64,26],[32,42],[58,16],[44,30]].map(([x,y])=>
          `<circle cx="${x}" cy="${y}" r="2.6" fill="${dk}" opacity=".45"/>`).join("");
      case "dots":
        return [[24,26],[34,22],[44,30],[54,24],[62,32],[30,36],[50,38],[68,26]].map(([x,y])=>
          `<circle cx="${x}" cy="${y}" r="1.7" fill="${lt}" opacity=".65"/>`).join("");
      case "waves":  // サバの背の波模様
        return [16,20,24].map((y,i)=>
          `<path d="M18 ${y} q10 -5 20 0 t20 0 t20 0" stroke="${dk}" stroke-width="2"
            fill="none" opacity="${.4-i*.08}"/>`).join("");
      case "line":   // 側線に沿った1本線
        return `<path d="M18 30 q26 -3 58 -2" stroke="${lt}" stroke-width="2.4" fill="none" opacity=".6"/>`;
      case "lines":  // カツオの腹の縦じま
        return [30,36,42].map(y=>
          `<path d="M22 ${y} q24 2 48 0" stroke="${dk}" stroke-width="1.8" fill="none" opacity=".45"/>`).join("");
      case "mesh":
        return [[26,22],[36,22],[46,22],[56,22],[31,30],[41,30],[51,30],[26,38],[36,38],[46,38],[56,38]]
          .map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2" fill="${dk}" opacity=".4"/>`).join("");
      case "eye":    // マトウダイの的
        return `<circle cx="44" cy="28" r="7" fill="none" stroke="${dk}" stroke-width="2.4" opacity=".55"/>
                <circle cx="44" cy="28" r="2.6" fill="${dk}" opacity=".4"/>`;
      default: return "";
    }
  }

  function fishSVG(name, w, h){
    const look = FISH_LOOK[name] || ["oval","#8C99A8"];
    const [form, col] = look;
    const back = shade(col,-38), dark = shade(col,-22), light = shade(col,30), pale = shade(col,58);
    const uid = "f" + Math.abs(hashOf(name+form)) % 100000;

    // 体の形。頭は丸く、尾に向かって細る。魚らしい非対称を作る。
    const OUT = {
      slim:    "M84 30 C78 22 60 16 40 17 C24 18 14 23 10 30 C14 37 24 42 40 43 C60 44 78 38 84 30 Z",
      oval:    "M86 30 C80 17 62 9 44 9 C24 9 10 18 6 30 C10 42 24 51 44 51 C62 51 80 43 86 30 Z",
      round:   "M84 30 C82 15 66 5 46 5 C24 5 8 16 8 30 C8 44 24 55 46 55 C66 55 82 45 84 30 Z",
      torpedo: "M88 30 C82 19 64 12 44 12 C24 12 10 19 6 30 C10 41 24 48 44 48 C64 48 82 41 88 30 Z",
      flat:    "M86 30 C80 14 60 6 42 8 C22 10 8 19 6 30 C8 41 22 50 42 52 C60 54 80 46 86 30 Z",
      marlin:  "M84 30 C78 20 60 14 42 15 C24 16 10 21 6 30 C10 39 24 44 42 45 C60 46 78 40 84 30 Z",
      shark:   "M88 31 C82 21 62 15 42 16 C24 17 10 22 6 30 C10 39 24 45 42 45 C62 45 82 40 88 31 Z"
    }[form];

    if(form === "squid"){
      return `<svg viewBox="0 0 100 60" width="${w}" height="${h}">
        <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${light}"/><stop offset="60%" stop-color="${col}"/>
          <stop offset="100%" stop-color="${dark}"/></linearGradient></defs>
        <g transform="translate(100,0) scale(-1,1)">
        <path d="M30 14 L46 4 L62 14 Z" fill="${dark}" opacity=".85"/>
        <ellipse cx="46" cy="26" rx="17" ry="20" fill="url(#${uid})"/>
        <ellipse cx="40" cy="20" rx="6" ry="9" fill="${pale}" opacity=".35"/>
        <path d="M34 44 q3 12 -3 15 M41 46 q1 12 -3 15 M46 46 q0 12 0 15 M51 46 q-1 12 3 15 M58 44 q-3 12 3 15"
              stroke="${dark}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M62 43 q10 8 14 3" stroke="${dark}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="39" cy="24" r="3.4" fill="#F2F2F5"/><circle cx="39.6" cy="24" r="2.1" fill="#12121A"/>
        </g>
      </svg>`;
    }

    // 尾びれ。形ごとに切れ込みの深さを変える。
    const tail = {
      slim:    "M10 30 L1 20 Q5 30 1 40 Z",
      oval:    "M8 30 L0 18 Q5 30 0 42 Z",
      round:   "M9 30 L3 22 Q6 30 3 38 Z",
      torpedo: "M8 30 L0 15 Q6 30 0 45 Z",
      flat:    "M7 30 L1 20 Q4 30 1 40 Z",
      marlin:  "M7 30 L0 13 Q6 30 0 47 Z",
      shark:   "M7 30 L0 12 Q5 28 2 44 Z"
    }[form];

    const dorsal = form==="shark"
      ? '<path d="M46 15 L54 1 L60 16 Z" fill="'+back+'"/>'
      : form==="flat"
        ? '<path d="M20 12 q22 -8 44 -2 q-22 4 -44 2 Z" fill="'+dark+'" opacity=".9"/>'
        : '<path d="M38 12 q14 -9 26 -1 q-14 3 -26 1 Z" fill="'+dark+'" opacity=".9"/>';

    const anal = '<path d="M40 47 q10 7 20 1 q-10 2 -20 -1 Z" fill="'+dark+'" opacity=".75"/>';
    const pect = '<path d="M60 33 q10 6 8 13 q-8 -4 -12 -11 Z" fill="'+dark+'" opacity=".8"/>';
    const bill = form==="marlin" ? '<path d="M84 29 L99 26" stroke="'+dark+'" stroke-width="3" stroke-linecap="round"/>' : "";
    const gill = '<path d="M72 18 q-5 12 1 23" stroke="'+back+'" stroke-width="1.4" fill="none" opacity=".6"/>';
    const mouth = '<path d="M85 31 q-4 2 -7 1" stroke="'+back+'" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    const eyeX = form==="flat" ? 74 : 78, eyeY = form==="flat" ? 24 : 27;

    // 図鑑と同じく頭を左に向ける。描画は右向きのまま、最後に左右反転する。
    return `<svg viewBox="0 0 100 60" width="${w}" height="${h}">
      <defs>
        <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="${back}"/>
          <stop offset="42%" stop-color="${col}"/>
          <stop offset="78%" stop-color="${light}"/>
          <stop offset="100%" stop-color="${pale}"/>
        </linearGradient>
        <clipPath id="c${uid}"><path d="${OUT}"/></clipPath>
      </defs>
      <g transform="translate(100,0) scale(-1,1)">
      <path d="${tail}" fill="${dark}"/>
      ${dorsal}${anal}
      <path d="${OUT}" fill="url(#${uid})"/>
      <g clip-path="url(#c${uid})">
        <ellipse cx="46" cy="14" rx="40" ry="10" fill="${back}" opacity=".3"/>
        <ellipse cx="48" cy="47" rx="36" ry="9" fill="${pale}" opacity=".45"/>
        ${patternOf(name, col)}
        <g opacity=".16">${scaleRows(back)}</g>
        <ellipse cx="52" cy="24" rx="22" ry="5" fill="#FFF" opacity=".22"/>
      </g>
      ${pect}${gill}${bill}${mouth}
      <circle cx="${eyeX}" cy="${eyeY}" r="4" fill="#F7F7FA"/>
      <circle cx="${eyeX+0.6}" cy="${eyeY}" r="2.4" fill="#12121A"/>
      <circle cx="${eyeX+1.6}" cy="${eyeY-1.2}" r=".9" fill="#FFF" opacity=".9"/>
      </g>
    </svg>`;
  }
  function scaleRows(c){
    let out = "";
    for(let row=0; row<5; row++){
      const y = 16 + row*6;
      for(let col2=0; col2<9; col2++){
        const x = 18 + col2*7 + (row%2)*3.5;
        out += `<path d="M${x} ${y} a4 4 0 0 1 7 0" stroke="${c}" stroke-width=".9" fill="none"/>`;
      }
    }
    return out;
  }
  function hashOf(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; }
  function shade(hex, amt){
    const n = parseInt(hex.slice(1),16);
    const c = [(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,v+amt)));
    return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
  }

  /* 池の情景。竿から糸が伸びて、先にワームが揺れる。 */
  /* ワームの絵。種類ごとに姿を変える。 */
  function lureSVG(name){
    const bait = {
      "ゴカイ":   ["worm","#C97A6E"], "イソメ":["worm","#A85C4A"], "アオイソメ":["worm","#6E7A5C"],
      "ジャリメ": ["worm","#C4A088"], "オキアミ":["shrimp","#E8A08C"], "エビ":["shrimp","#E88C7A"],
      "カニ":     ["crab","#C4705C"], "イカタン":["strip","#E8DCC9"], "ミミズ":["worm","#B06B5C"],
      "ブドウ虫": ["grub","#E8D9A8"], "サシ":["grub","#F0E4C4"], "練りエサ":["dough","#D9C48C"],
      "カラーワーム":["worm","#8C6BC4"], "シャッドテール":["soft","#6EA8C4"], "グラブ":["soft","#7AC48C"],
      "ストレート":["worm","#5C8CC4"], "クローワーム":["crab","#5C6E4A"], "シュリンプ":["shrimp","#D98C7A"],
      "スイムベイト":["plug","#8CA8C4"], "メタルジグ":["jig","#C9CCD1"], "タイラバ":["rubber","#D9604A"],
      "インチク":["jig","#C4A05C"], "バイブレーション":["plug","#7A94B0"], "ビッグベイト":["plug","#5C7A5C"],
      "ためし釣り":["worm","#E8A0B4"]
    }[name] || ["worm","#E8A0B4"];
    const [form, col] = bait;
    const dk = shade(col,-30), lt = shade(col,32);
    const hook = '<path d="M0 -14 L0 4 q0 8 -7 8 q-6 0 -6 -6" stroke="#B8BCC4" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
    const P = {
      worm:  `<path d="M-1 -8 q7 5 -2 11 q-8 5 1 11 q7 5 -1 9" stroke="${col}" stroke-width="5.5"
                fill="none" stroke-linecap="round"/>
              <path d="M-1 -8 q7 5 -2 11" stroke="${lt}" stroke-width="2" fill="none" opacity=".6"/>`,
      shrimp:`<path d="M2 -8 q9 6 5 15 q-4 8 -12 8" stroke="${col}" stroke-width="6" fill="none" stroke-linecap="round"/>
              <path d="M-5 15 l-6 5 M-5 15 l-2 8" stroke="${dk}" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="4" cy="-6" r="1.6" fill="#22222A"/>`,
      crab:  `<ellipse cx="0" cy="4" rx="9" ry="7" fill="${col}"/>
              <path d="M-9 0 q-7 -4 -9 2 M9 0 q7 -4 9 2" stroke="${dk}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
              <path d="M-7 9 l-5 6 M0 11 l0 7 M7 9 l5 6" stroke="${dk}" stroke-width="1.8" stroke-linecap="round"/>`,
      grub:  `<ellipse cx="0" cy="3" rx="6" ry="9" fill="${col}"/>
              <path d="M-6 -1 h12 M-6 4 h12 M-5 9 h10" stroke="${dk}" stroke-width="1.2" opacity=".5"/>`,
      dough: `<circle cx="0" cy="3" r="8" fill="${col}"/>
              <circle cx="-3" cy="0" r="2.4" fill="${lt}" opacity=".7"/>`,
      strip: `<path d="M-4 -8 L4 -8 L3 14 L-3 14 Z" fill="${col}"/>
              <path d="M0 -8 L0 14" stroke="${dk}" stroke-width="1" opacity=".5"/>`,
      soft:  `<path d="M0 -8 q6 8 2 14" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round"/>
              <path d="M2 6 q9 5 3 13 q-5 -4 -6 -10" fill="${col}"/>`,
      plug:  `<ellipse cx="0" cy="2" rx="6" ry="12" fill="${col}"/>
              <path d="M0 14 l-6 8 l6 -3 l6 3 Z" fill="${dk}"/>
              <circle cx="-2" cy="-5" r="2" fill="#F2F2F5"/><circle cx="-2" cy="-5" r="1.1" fill="#22222A"/>`,
      jig:   `<path d="M0 -10 L5 4 L0 16 L-5 4 Z" fill="${col}"/>
              <path d="M0 -10 L5 4 L0 16 Z" fill="${lt}" opacity=".5"/>`,
      rubber:`<ellipse cx="0" cy="0" rx="7" ry="6" fill="${col}"/>
              <path d="M-5 5 q-2 12 2 15 M0 6 q0 12 0 14 M5 5 q2 12 -2 15"
                stroke="${dk}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`
    }[form];
    return hook + P;
  }

  /* 竿の形。静止した1つの形だけを持ち、しなりは表現しない。
     0 = まっすぐ / 正 = 手前に曲がる / 負 = 先が沈む(合わせ・食い込み用に少しだけ使う)。 */
  function rodPath(bend){
    const tipX = 226 - bend*30, tipY = 40 + bend*40;
    const c1x = 70 + bend*6,  c1y = 120 + bend*10;
    const c2x = 132 - bend*14, c2y = 84 + bend*22;
    return { d:`M6 176 Q${c1x} ${c1y} ${c2x} ${c2y} Q${186-bend*26} ${54+bend*28} ${tipX} ${tipY}`,
             tipX, tipY };
  }

  /* 投げる瞬間は、竿の「形」を変えるのではなく、竿の絵ぜんたい(曲線・持ち手・
     リール・ガイド)を、手もと(支点)を中心に剛体として回転させる。
     こうすると、竿の形をそのまま回すだけなので、リールなどの部品が
     置いてけぼりになってズレることが原理的に起こらない。
     糸の根もとは、回転後の穂先の座標をそのつど計算して使う。 */
  const ROD_PIVOT = { x:20, y:172 };   // 手もと(グリップ)。ここを中心に振る
  function rotatePoint(px, py, cx, cy, deg){
    const rad = deg * Math.PI / 180;
    const dx = px - cx, dy = py - cy;
    const c = Math.cos(rad), s = Math.sin(rad);
    return { x: cx + dx*c - dy*s, y: cy + dx*s + dy*c };
  }

  let castRaf = null;
  function cancelCastAnim(){ if(castRaf){ cancelAnimationFrame(castRaf); castRaf = null; } }
  function smoothstep(x){ x = Math.max(0, Math.min(1,x)); return x*x*(3-2*x); }
  function lerpKF(keys, t){
    for(let i=0;i<keys.length-1;i++){
      const [t0,v0] = keys[i], [t1,v1] = keys[i+1];
      if(t <= t1){
        const local = t1===t0 ? 1 : smoothstep((t-t0)/(t1-t0));
        return v0 + (v1-v0)*local;
      }
    }
    return keys[keys.length-1][1];
  }
  // 竿の回転角(度)。マイナス=反時計回り(上へ、頭上へ振りかぶる)
  // プラス=時計回り(前へ、水面へ向けて振り抜く)。
  // 0(構え) → 大きく振りかぶり(上) → 勢いよく振り抜く(前) → 収まる、の順。
  const ROT_KF = [[0,0],[0.30,-58],[0.58,36],[0.74,10],[0.86,-6],[0.95,2],[1,0]];
  // ワームが竿を離れて飛んでいく進み具合(0=まだ竿先/1=着水)。振り抜きの頂点(0.58)で離れる。
  const LURE_KF = [[0,0],[0.58,0],[0.88,1],[1,1]];

  function drawThrowFrame(t, wormName, prevTip){
    const SEA = 118, water = {x:226, y:SEA};
    const R0 = rodPath(0);                              // 竿の形はいつも同じ、静止形
    const rot = lerpKF(ROT_KF, t);                       // いまの回転角
    const tip = rotatePoint(R0.tipX, R0.tipY, ROD_PIVOT.x, ROD_PIVOT.y, rot); // 回転後の穂先
    const lureT = lerpKF(LURE_KF, t);

    let far;
    if(lureT <= 0){
      far = tip;                                          // まだ竿先についたまま、竿と一緒に振られる
    }else{
      const releaseRot = lerpKF(ROT_KF, 0.58);
      const releaseTip = rotatePoint(R0.tipX, R0.tipY, ROD_PIVOT.x, ROD_PIVOT.y, releaseRot);
      const arcH = 55*Math.sin(Math.PI*lureT);            // 弧を描いて飛ぶ
      far = {
        x: releaseTip.x + (water.x-releaseTip.x)*lureT,
        y: releaseTip.y + (water.y-releaseTip.y)*lureT - arcH
      };
    }

    // 糸のしなり: 穂先の動く速さと向きから、糸の膨らみを作る。
    // 竿が急に振れるほど糸は置いていかれて弓なりになり、着水が近づくほどまっすぐ張る。
    let ctrlOffX = 0, ctrlOffY = 0;
    if(prevTip){
      const vx = tip.x - prevTip.x, vy = tip.y - prevTip.y;
      const settle = 1 - smoothstep(lureT);
      ctrlOffX = -vy * 1.6 * settle;
      ctrlOffY =  vx * 1.6 * settle;
    }

    // 竿の絵(曲線・持ち手・リール・ガイド)はすべて同じ<g>の中に置き、
    // その<g>ごと rotate() で回す。これで全部品が同じ角度で一緒に動く。
    const rod = `
      <g class="rodG" transform="rotate(${rot.toFixed(2)} ${ROD_PIVOT.x} ${ROD_PIVOT.y})">
        <path d="${R0.d}" stroke="#2E2A26" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/>
        <path d="${R0.d}" stroke="#8C5A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
        <rect x="4" y="164" width="34" height="13" rx="6" transform="rotate(-33 20 170)" fill="#1F1C19"/>
        <g transform="translate(56 140) rotate(-33)">
          <circle r="9" fill="#9AA0A8"/><circle r="5" fill="#6E747C"/><circle r="1.8" fill="#3A3E44"/>
        </g>
        <circle cx="112" cy="98" r="3.4" fill="none" stroke="#B8BCC4" stroke-width="1.6"/>
        <circle cx="168" cy="68" r="3"   fill="none" stroke="#B8BCC4" stroke-width="1.6"/>
        <circle cx="${R0.tipX-14}" cy="${R0.tipY+6}" r="2.6" fill="none" stroke="#B8BCC4" stroke-width="1.6"/>
      </g>
      <path class="lineMain" d="M${tip.x} ${tip.y}
            Q${(tip.x+far.x)/2+ctrlOffX} ${(tip.y+far.y)/2-6+ctrlOffY} ${far.x} ${far.y}"
            stroke="url(#lg)" stroke-width="1" fill="none"/>`;
    const grad = `<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(255,255,255,.55)"/>
        <stop offset="72%" stop-color="rgba(255,255,255,.45)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </linearGradient></defs>`;
    const lure = lureT > 0 ? `<g transform="translate(${far.x} ${far.y})">${lureSVG(wormName)}</g>` : "";
    const splash = lureT >= 0.995
      ? `<circle class="splash" cx="${water.x}" cy="${water.y}" r="10"/>
         <circle class="splash" cx="${water.x}" cy="${water.y}" r="17" style="animation-delay:.08s"/>` : "";
    $("scene").innerHTML = `${grad}${rod}${lure}${splash}`;
    return tip;
  }

  function animateThrow(ms, wormName, onDone){
    cancelCastAnim();
    const t0 = performance.now();
    let prevTip = null;
    const step = now=>{
      const t = Math.min(1, (now-t0)/ms);
      prevTip = drawThrowFrame(t, wormName, prevTip);
      if(t < 1){ castRaf = requestAnimationFrame(step); }
      else{ castRaf = null; onDone && onDone(); }
    };
    castRaf = requestAnimationFrame(step);
  }

  function drawScene(mode, fishName, lureName){
    const s = $("scene");
    const SEA = 118;
    const bend = mode==="hooked" ? 0.5 : 0;   // 魚の重みで穂先が下がる
    const R = rodPath(bend);

    // 糸は穂先から水面へ。合わせた時は、魚が最終的に落ち着く位置(hangUpの終点)に合わせる。
    // ここを釣り上げ途中の位置にすると、魚が浮き上がる間 糸だけ動かず、魚が糸から外れて見えてしまう。
    const lineEnd = mode==="hooked" ? {x:214, y:56} : {x:226, y:SEA+6};
    const lineEl = `<path class="lineMain" d="M${R.tipX} ${R.tipY}
                    Q${(R.tipX+lineEnd.x)/2+4} ${(R.tipY+lineEnd.y)/2} ${lineEnd.x} ${lineEnd.y}"
                    stroke="url(#lg)" stroke-width="1" fill="none"/>`;

    // 糸は竿(rodG)の中に置く。竿が振れて穂先が動くアニメーション中も、
    // 糸の根もとが必ず穂先にくっついたまま動くようにするため。
    // (以前は糸を竿の外に静止画として描いていたため、竿だけが振れて
    //  糸が置き去りになる見た目のズレが起きていた)
    const rod = `
      <g class="rodG">
        <path d="${R.d}" stroke="#2E2A26" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/>
        <path d="${R.d}" stroke="#8C5A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
        <rect x="4" y="164" width="34" height="13" rx="6" transform="rotate(-33 20 170)" fill="#1F1C19"/>
        <g transform="translate(56 140) rotate(-33)">
          <circle r="9" fill="#9AA0A8"/><circle r="5" fill="#6E747C"/><circle r="1.8" fill="#3A3E44"/>
        </g>
        <circle cx="112" cy="98" r="3.4" fill="none" stroke="#B8BCC4" stroke-width="1.6"/>
        <circle cx="168" cy="68" r="3"   fill="none" stroke="#B8BCC4" stroke-width="1.6"/>
        <circle cx="${R.tipX-14}" cy="${R.tipY+6}" r="2.6" fill="none" stroke="#B8BCC4" stroke-width="1.6"/>
        ${mode==="snapped" ? "" : lineEl}
      </g>`;

    const grad = `<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(255,255,255,.55)"/>
        <stop offset="72%" stop-color="rgba(255,255,255,.45)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </linearGradient></defs>`;

    const rings = mode==="cast" ? `
      <g class="ripple">
        <ellipse cx="226" cy="${SEA}" rx="9"  ry="3"   fill="none" stroke="rgba(190,225,255,.55)" stroke-width="1.3"/>
        <ellipse cx="226" cy="${SEA}" rx="18" ry="5.5" fill="none" stroke="rgba(190,225,255,.34)" stroke-width="1.1" style="animation-delay:1.1s"/>
        <ellipse cx="226" cy="${SEA}" rx="27" ry="8"   fill="none" stroke="rgba(190,225,255,.2)"  stroke-width="1" style="animation-delay:2.2s"/>
      </g>` : "";
    const bubbles = mode==="cast"
      ? `<circle class="bub" cx="120" cy="158" r="3.4"/>
         <circle class="bub" cx="196" cy="166" r="2.6"/>
         <circle class="bub" cx="158" cy="150" r="3"/>` : "";

    let center = "";
    if(mode === "hooked"){
      // 糸の先に魚がぶら下がっている。水面から引き上げられる。
      center = `
        <circle class="splash" cx="226" cy="${SEA}" r="12"/>
        <circle class="splash" cx="226" cy="${SEA}" r="22" style="animation-delay:.1s"/>
        <circle class="splash" cx="226" cy="${SEA}" r="32" style="animation-delay:.2s"/>
        <g class="hang" transform="translate(${lineEnd.x} ${lineEnd.y})">
          <g class="hangSwing">
            <g transform="translate(-70 -30)">${fishSVG(fishName,140,84)}</g>
          </g>
        </g>
        <circle class="drip" cx="204" cy="${SEA-6}" r="2.4" fill="rgba(200,230,255,.8)"/>
        <circle class="drip" cx="228" cy="${SEA}"   r="1.8" fill="rgba(200,230,255,.7)" style="animation-delay:.35s"/>
        <circle class="drip" cx="216" cy="${SEA-14}" r="2"  fill="rgba(200,230,255,.75)" style="animation-delay:.5s"/>`;
    }else if(mode === "snapped"){
      center = `<path d="M${R.tipX} ${R.tipY} Q227 58 223 72" stroke="url(#lg)" stroke-width="1" fill="none"/>
        <path d="M230 96 Q228 106 226 ${SEA}" stroke="url(#lg)" stroke-width="1" fill="none" opacity=".4"/>`;
    }
    s.innerHTML = `${grad}${rod}${rings}${bubbles}${center}`;
  }

  function drawPond(){
    const el = $("pond");
    el.className = "pond" + (cast ? " casting" : "");
    if(!cast) $("scene").dataset.m = "idle";
    if(!cast){
      const w = wormOf(wormH);
      drawScene("idle", null, wormOf(wormH).name);
      $("pondState").textContent = "まだ 糸を垂らしていません";
      $("pondBig").textContent = `${w.name}`;
      $("pondSub").textContent = w.yen ? `¥${w.yen.toLocaleString()} ／ ${w.hours}時間で釣れる` : "お金はかかりません ／ 10秒で釣れる";
      $("castBtn").style.display = "";
      $("pullBtn").style.display = "none";
      const have = bagCount(w.hours);
      $("castBtn").textContent = !w.yen
        ? "ためしに 糸を垂らす（無料）"
        : have > 0
          ? `${w.name}で 糸を垂らす`
          : `${w.name}を買って 糸を垂らす（¥${w.yen.toLocaleString()}）`;
      // 使っていないワームは、いつでも売って全額もどせる
      if(w.yen && have > 0){
        $("sellBtn").style.display = "";
        $("sellBtn").textContent = `${w.name}を売る（¥${w.yen.toLocaleString()} もどる）`;
      }else{
        $("sellBtn").style.display = "none";
      }
      $("fishNote").textContent = "垂らしてから10秒以内なら、お金を取り出せます。";
      return;
    }
    const left = cast.ms - (Date.now() - cast.startedAt);
    if($("scene").dataset.m === "throwing") { /* 投げ入れ中は触らない */ }
    else if($("scene").dataset.m !== "cast"){ drawScene("cast", null, cast.name); $("scene").dataset.m = "cast"; }
    $("pondState").textContent = `${cast.name}で 釣り中`;
    $("pondBig").textContent = fmtLeft(left);
    $("pondSub").textContent = cast.yen ? `¥${cast.yen.toLocaleString()}ぶん 沈めています` : "ためし釣り";
    $("castBtn").style.display = "none";
    $("sellBtn").style.display = "none";
    $("pullBtn").style.display = "";
    if(canPull()){
      const rest = Math.ceil((PULL_WINDOW - (Date.now() - cast.startedAt))/1000);
      $("pullBtn").textContent = cast.yen ? `糸を上げて ¥${cast.yen.toLocaleString()} を取り出す（${rest}）` : `やめる（${rest}）`;
      $("pullBtn").disabled = false;
      $("fishNote").textContent = "取り出せるのは いまから10秒だけです。";
    }else{
      $("pullBtn").textContent = "もう 取り出せません";
      $("pullBtn").disabled = true;
      $("fishNote").textContent = "この画面を離れると 糸が切れて、ワームは戻りません。";
    }
  }
  function fmtLeft(ms){
    const s = Math.max(0, Math.ceil(ms/1000));
    const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
    return h>0 ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`;
  }

  function drawCreel(){
    $("creelCount").textContent = `${new Set(creel.map(f=>f.name)).size} / ${FISH_TOTAL}`;
    // 同じ魚はまとめて数える。レアな順、同じレアなら多い順に並べる。
    const tally = new Map();
    for(const f of creel){
      const k = f.name;
      const t = tally.get(k) || { name:f.name, rarity:f.rarity, n:0 };
      t.n++; tally.set(k, t);
    }
    const list = [...tally.values()].sort((a,b)=> b.rarity-a.rarity || b.n-a.n || a.name.localeCompare(b.name));
    $("creelGrid").innerHTML = list.length
      ? list.map(f=>
          `<span class="fishTag r${f.rarity}">
             ${fishSVG(f.name,34,20)}
             <span class="fn">${esc(f.name)}</span>
             ${f.n>1?`<span class="mul">×${f.n}</span>`:""}
             <span class="r">${RARITY_NAME[f.rarity]}</span>
           </span>`).join("")
      : `<span class="creelEmpty">まだ 何も釣れていません</span>`;
  }

  $("sellBtn").onclick = ()=>{
    const w = wormOf(wormH);
    if(!w.yen || bagCount(w.hours) <= 0) return;
    bag[w.hours] = bagCount(w.hours) - 1;
    if(!bag[w.hours]) delete bag[w.hours];
    saveBag(); drawWorms(); drawPond();
    $("pondBig").textContent = "売りました";
    $("pondSub").textContent = `¥${w.yen.toLocaleString()} がもどりました`;
    $("fishNote").textContent = "使っていないワームは いつでも売れます。";
  };
  let staging = false;      // 演出中は他の描画で上書きしない
  $("castBtn").onclick = ()=>{
    if(cast || staging) return;
    const w = wormOf(wormH);
    if(w.yen){
      // 在庫が無ければ、ここで買う
      if(bagCount(w.hours) <= 0) bag[w.hours] = 1;
      bag[w.hours] = bagCount(w.hours) - 1;   // 1本を糸に付ける
      if(!bag[w.hours]) delete bag[w.hours];
      saveBag();
    }
    // 投げる演出を見せてから、実際の計測を始める
    staging = true;
    $("pond").className = "pond casting-throw";
    $("scene").dataset.m = "throwing";
    $("pondState").textContent = "投げています";
    $("pondBig").textContent = w.name;
    $("pondSub").textContent = "";
    $("castBtn").style.display = "none";
    $("sellBtn").style.display = "none";
    drawWorms();
    animateThrow(1100, w.name, ()=>{
      staging = false;
      cast = { hours:w.hours, ms:w.ms, yen:w.yen, name:w.name, startedAt: Date.now() };
      $("scene").dataset.m = "";
      drawWorms(); drawPond();
    });
  };
  $("pullBtn").onclick = ()=>{
    if(!canPull()) return;
    const yen = cast.yen, hrs = cast.hours;
    if(yen){ bag[hrs] = bagCount(hrs) + 1; saveBag(); }   // ワームは手元に戻る
    cast = null;
    drawWorms(); drawPond();
    $("pullBtn").disabled = false;
    $("pondBig").textContent = "取り出しました";
    $("pondSub").textContent = yen ? `¥${yen.toLocaleString()} が戻りました` : "ためし釣りを やめました";
    $("fishNote").textContent = "またいつでも 糸を垂らせます。";
  };

  function hooked(){
    const got = pickFish(cast.hours);
    // まず竿を持ち上げて、糸の先で魚が暴れる。そのあと水面から抜く。
    const el0 = $("pond");
    el0.className = "pond";
    drawScene("fight", got.name);
    $("scene").dataset.m = "fight";
    $("pondState").textContent = "かかりました";
    $("pondBig").textContent = "…";
    $("pondSub").textContent = "";
    staging = true;
    setTimeout(()=>{ staging = false; land(got); }, 1200);
  }
  function land(got){
    creel.push(got);
    fstore.save(creel);
    const yen = cast.yen, hrs = cast.hours;
    if(yen){ bag[hrs] = bagCount(hrs) + 1; saveBag(); }   // 釣り上げたらワームも回収
    cast = null;
    drawWorms(); drawCreel();
    const el = $("pond");
    el.className = "pond hooked";
    drawScene("hooked", got.name); $("scene").dataset.m = "hooked";
    $("pondState").textContent = "釣れました";
    $("pondBig").textContent = got.name;
    $("pondSub").textContent = yen ? `${RARITY_NAME[got.rarity]} ／ ¥${yen.toLocaleString()} も戻りました` : RARITY_NAME[got.rarity];
    $("castBtn").style.display = "";
    $("pullBtn").style.display = "none";
    $("fishNote").textContent = "びくに入りました。";
  }
  function snap(){
    if(staging && !cast){
      // 投げている最中(まだ cast が立つ前)に離脱した場合は、演出だけ止める
      cancelCastAnim();
      staging = false;
      $("scene").dataset.m = "idle";
      drawWorms(); drawPond();
      return;
    }
    if(!cast) return;
    cancelCastAnim();
    const yen = cast.yen, nm = cast.name;
    cast = null;
    drawWorms();
    const el = $("pond");
    el.className = "pond snapped";
    drawScene("snapped"); $("scene").dataset.m = "snapped";
    $("pondState").textContent = "糸が切れました";
    $("pondBig").textContent = `${nm} を 失いました`;
    $("pondSub").textContent = yen ? `¥${yen.toLocaleString()} は戻りません` : "ためし釣りなので お金は減りません";
    $("castBtn").style.display = "";
    $("pullBtn").style.display = "none";
    $("fishNote").textContent = "画面を離れたため、釣りは終わりました。";
  }

  // 離脱の検知。ここがこの機能の核心。
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "hidden") snap();
  });
  window.addEventListener("pagehide", snap);

  setInterval(()=>{
    if(!cast || staging) return;
    if(Date.now() - cast.startedAt >= cast.ms) hooked();
    else drawPond();
  }, 250);

  drawWorms(); drawPond(); drawCreel();

  render();
  setInterval(()=>{ if(!drag){ drawDial(); drawNow(); } }, 1000);
})();
</script>
</body>
</html>
