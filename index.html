<!-- Diagnostics: catches any uncaught error/rejection (e.g. a React render crash)
     and shows it on screen, instead of a silent blank/black page. -->
<script>
  function owsShowBootError(msg) {
    var el = document.getElementById('boot-error');
    if (!el) return;
    if (!el.dataset.inited) {
      el.dataset.inited = '1';
      var close = document.createElement('button');
      close.textContent = '\u2715 \u9589\u3058\u308B';
      close.style.cssText = 'position:sticky;top:0;float:right;font-size:13px;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,0.1);color:#EAE4D0;border:1px solid #665;';
      close.onclick = function () { el.style.display = 'none'; };
      el.appendChild(close);
      var hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'エラーが発生しました。この内容をスクリーンショットして送ってください:';
      el.appendChild(hint);
    }
    el.style.display = 'block';
    var p = document.createElement('div');
    p.textContent = msg;
    p.style.marginBottom = '8px';
    p.style.borderBottom = '1px solid #552';
    p.style.paddingBottom = '8px';
    el.appendChild(p);
  }
  window.addEventListener('error', function (e) {
    // 別オリジン(CDN等)のスクリプトのエラーは、ブラウザが中身を伏せて
    // 「Script error.」だけを渡してくる。原因も場所も分からず対処できないうえ、
    // 実際にはゲームが正常に動いていることがほとんどなので、画面全体を覆わない。
    if ((e.message === 'Script error.' || e.message === 'Script error') && !e.filename && !(e.error && e.error.stack)) return;
    var msg = 'JSエラー: ' + (e.message || (e.error && e.error.message) || '不明なエラー');
    if (e.filename) msg += '\n場所: ' + e.filename + ':' + e.lineno + ':' + e.colno;
    if (e.error && e.error.stack) msg += '\n' + e.error.stack.split('\n').slice(0, 4).join('\n');
    owsShowBootError(msg);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    var msg = 'Promiseエラー: ' + (reason && reason.message ? reason.message : String(reason));
    owsShowBootError(msg);
  });
</script>
